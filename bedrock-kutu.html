<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yakında...</title>
  <meta name="description" content="Yeni dünyamız tuğla tuğla inşa ediliyor. Yakında...">
  <meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)">

  <!-- Open Graph / Sosyal Medya Etiketleri -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:title" content="Yakında...">
  <meta property="og:description" content="Yeni dünyamız tuğla tuğla inşa ediliyor.">

  <!-- Inline SVG Favicon (Tuğla & Kalkan Motifi) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='7' width='11' height='7' rx='1.5' fill='%23B85232'/%3E%3Crect x='17' y='7' width='11' height='7' rx='1.5' fill='%23C98A2C'/%3E%3Crect x='9' y='17' width='14' height='8' rx='1.5' fill='%23B85232'/%3E%3C/svg%3E">

  <!-- Google Fonts: Instrument Serif & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. TASARIM SİSTEMİ & RENK DEĞİŞKENLERİ (:root)
       ========================================================================== */
    :root {
      /* Doğal Taş & Sıcak Parşömen Paleti (Aydınlık Mod) */
      --bg-base: #F4EFE6;
      --surface: #EAE2D3;
      --accent: #B85232;
      --amber: #C98A2C;

      /* 4 Taş / Kömür Grisi Tonu */
      --ink-primary: #1E1C19;
      --ink-secondary: #585249;
      --border: #D4CBB9;
      --stone-dark: #2C2925;

      /* İllüstrasyon & Zanaat Tonları */
      --brick-a: #B85232;
      --brick-b: #A14427;
      --brick-c: #C96544;
      --brick-crest: #D6CCBA;
      --mortar: #DCD3C2;
      --skin: #E0B195;
      --tunic-slate: #313E47;
      --tunic-canvas: #51626D;
      --leather: #9C6F44;
      --timber: #A5784B;
      --iron: #635E56;

      /* Katmanlı Derinlik */
      --scene-shadow:
        0 1px 2px rgba(30, 28, 25, 0.05),
        0 16px 40px -12px rgba(30, 28, 25, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.75);

      /* Tipografi & Hareket */
      --font-display: 'Instrument Serif', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --ease-craft: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Gece Atölyesi & Koyu Doğal Taş Modu */
        --bg-base: #161412;
        --surface: #1F1C19;
        --accent: #CC6342;
        --amber: #DDA03E;

        --ink-primary: #F2EDE4;
        --ink-secondary: #A69E91;
        --border: #302C27;
        --stone-dark: #100F0D;

        --brick-a: #CC6342;
        --brick-b: #B25132;
        --brick-c: #DA7656;
        --brick-crest: #3C3730;
        --mortar: #474139;

        --scene-shadow:
          0 2px 6px rgba(0, 0, 0, 0.35),
          0 20px 48px -12px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }
    }

    /* ==========================================================================
       2. TEMEL YERLEŞİM, DOKU & SIFIRLAMA
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      background-color: var(--bg-base);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
      background-image:
        radial-gradient(circle at 50% 38%, rgba(201, 138, 44, 0.08) 0%, transparent 58%),
        radial-gradient(circle at 50% 100%, rgba(184, 82, 50, 0.06) 0%, transparent 52%);
    }

    /* Çok Hafif SVG Grain / Parşömen Dokusu */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0.032;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain)'/%3E%3C/svg%3E");
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 6px;
      border-radius: 18px;
    }

    /* ==========================================================================
       3. TAM EKRAN MERKEZ KOMPOZİSYON (SADECE SAHNE + 'Yakında...')
       ========================================================================== */
    .stage-container {
      width: min(92vw, 620px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 4vh, 40px);
      padding: 16px;
      z-index: 1;
    }

    .scene-frame {
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--scene-shadow);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      transform: translateY(14px);
      animation: stageReveal 0.8s var(--ease-craft) forwards;
      transition:
        border-color 0.25s var(--ease-craft),
        transform 0.2s var(--ease-craft);
    }

    .scene-frame:hover {
      border-color: var(--accent);
    }

    .scene-frame:active {
      transform: scale(0.992);
    }

    .builders-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .coming-soon-title {
      font-family: var(--font-display);
      font-weight: 400;
      font-style: italic;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -0.015em;
      color: var(--ink-primary);
      text-align: center;
      opacity: 0;
      transform: translateY(12px);
      animation: stageReveal 0.8s var(--ease-craft) 0.16s forwards;
    }

    @keyframes stageReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==========================================================================
       4. DUVAR ÖRME & İŞÇİ HAREKET FİZİĞİ
       ========================================================================== */
    .drafting-grid-stroke {
      stroke: var(--ink-primary);
      stroke-opacity: 0.055;
    }

    /* Tuğla Yerleşme Yaylanması */
    .wall-brick {
      opacity: 0;
      transform: translateY(-18px) scale(0.92);
      transform-box: fill-box;
      transform-origin: center;
      transition:
        opacity 0.35s var(--ease-craft),
        transform 0.52s var(--ease-craft);
    }

    .wall-brick.is-placed {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .mortar-line {
      opacity: 0;
      transition: opacity 0.32s var(--ease-craft);
    }

    .mortar-line.is-visible {
      opacity: 1;
    }

    /* Vinç Arabası & Sallanan Tuğla */
    #crane-carriage {
      transition: transform 0.65s var(--ease-craft);
    }

    #crane-rope-group {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: ropeSway 3.4s var(--ease-craft) infinite;
    }

    @keyframes ropeSway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }

    /* Sol Usta (Mala ile Harç Süren ve Tuğla Oturtan İşçi) */
    #worker-left-arm {
      transform-box: fill-box;
      transform-origin: 18% 25%;
      animation: trowelWork 2s var(--ease-craft) infinite;
    }

    #worker-left-head {
      transform-box: fill-box;
      transform-origin: 50% 80%;
      animation: headFocusLeft 2s var(--ease-craft) infinite;
    }

    @keyframes trowelWork {
      0%, 100% { transform: rotate(0deg) translate(0, 0); }
      35% { transform: rotate(-16deg) translate(-3px, -4px); }
      68% { transform: rotate(13deg) translate(4px, 3px); }
    }

    @keyframes headFocusLeft {
      0%, 100% { transform: rotate(0deg); }
      45% { transform: rotate(5deg) translateY(1px); }
      78% { transform: rotate(-2deg); }
    }

    /* Sağ Usta (Şakül & Su Terazisi ile Hizalayan İşçi) */
    #worker-right-arm {
      transform-box: fill-box;
      transform-origin: 82% 25%;
      animation: levelCheck 2.6s var(--ease-craft) infinite;
    }

    #worker-right-head {
      transform-box: fill-box;
      transform-origin: 50% 80%;
      animation: headFocusRight 2.6s var(--ease-craft) infinite;
    }

    #plumb-bob {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: plumbSwing 2.6s var(--ease-craft) infinite;
    }

    @keyframes levelCheck {
      0%, 100% { transform: rotate(0deg) translate(0, 0); }
      42% { transform: rotate(9deg) translate(-2px, -2px); }
      76% { transform: rotate(-5deg) translate(2px, 2px); }
    }

    @keyframes headFocusRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-6deg) translateY(1px); }
    }

    @keyframes plumbSwing {
      0%, 100% { transform: rotate(-3.5deg); }
      50% { transform: rotate(3.5deg); }
    }

    /* Gizli Etkileşim: Sahneye Tıklayınca Ustalar Hızlanır */
    .is-fast #worker-left-arm { animation-duration: 0.72s; }
    .is-fast #worker-left-head { animation-duration: 0.72s; }
    .is-fast #worker-right-arm { animation-duration: 0.88s; }
    .is-fast #worker-right-head { animation-duration: 0.88s; }
    .is-fast #crane-rope-group { animation-duration: 1.05s; }

    /* Harç & Tuğla Tozu Partikülleri */
    .dust-particle {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }

    .dust-particle.is-burst {
      animation: dustRise 0.65s var(--ease-craft) forwards;
    }

    @keyframes dustRise {
      0% { opacity: 0.88; transform: translate(0, 0) scale(0.5); }
      100% { opacity: 0; transform: translate(var(--dx, 8px), -14px) scale(1.45); }
    }

    /* ==========================================================================
       5. AZALTILMIŞ HAREKET (PREFERS-REDUCED-MOTION: REDUCE)
       ========================================================================== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .scene-frame,
      .coming-soon-title,
      .wall-brick {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>

  <main class="stage-container">
    <!-- 1. Öğe: Duvar Yapan İşçiler Vektörel Animasyon Sahnesi -->
    <figure
      class="scene-frame"
      id="scene-frame"
      role="button"
      tabindex="0"
      aria-label="Duvar ören ustalar animasyon sahnesi"
    >
      <svg
        class="builders-svg"
        id="builders-svg"
        viewBox="0 0 560 420"
        role="img"
        aria-labelledby="svg-title svg-desc"
      >
        <title id="svg-title">Duvar ören iki usta işçi</title>

        <defs>

        <!-- Mimari Çizim Izgarası -->

          <line x1="106" y1="86" x2="106" y2="366"/>
          <line x1="64" y1="146" x2="106" y2="146"/>
          <line x1="64" y1="216" x2="106" y2="216"/>
          <line x1="64" y1="286" x2="106" y2="286"/>

          <rect x="44" y="34" width="472" height="4" rx="2" fill="#BE9263" opacity="0.55"/>
          <rect x="68" y="46" width="12" height="40" rx="2" fill="var(--timber)"/>
          <rect x="480" y="46" width="12" height="40" rx="2" fill="var(--timber)"/>

          <g id="crane-carriage" transform="translate(278, 0)">

            <circle cx="-10" cy="40" r="3" fill="var(--amber)"/>
            <circle cx="10" cy="40" r="3" fill="var(--amber)"/>

            <g id="crane-rope-group">
              <line x1="0" y1="50" x2="0" y2="108" stroke="var(--ink-secondary)" stroke-width="2"/>
              <path d="M-5 108 h10 l3 8 h-16 z" fill="var(--iron)"/>
              <!-- İndirilen Tuğla Blok -->
              <rect x="-24" y="116" width="48" height="22" rx="3" fill="var(--brick-a)" stroke="rgba(30, 28, 25, 0.2)" stroke-width="1.2"/>
            </g>
          </g>
        </g>

        <!-- Taş Zemin Tablası -->
        <rect x="32" y="366" width="496" height="14" rx="4" fill="var(--border)"/>
        <line x1="20" y1="380" x2="540" y2="380" stroke="var(--ink-secondary)" stroke-opacity="0.35" stroke-width="1.5"/>

        <!-- Sol Zemin Yedek Tuğlalar & Harç Teknesi -->
        <g aria-hidden="true">
          <rect x="48" y="348" width="42" height="16" rx="2.5" fill="var(--brick-b)"/>
          <rect x="94" y="348" width="42" height="16" rx="2.5" fill="var(--brick-a)"/>
          <rect x="70" y="330" width="42" height="16" rx="2.5" fill="var(--brick-c)"/>
          <path d="M148 335 H182 L177 366 H153 Z" fill="var(--iron)"/>
          <ellipse cx="165" cy="335" rx="17" ry="4" fill="var(--mortar)"/>
        </g>

        <!-- ================================================================
             SOL USTA İŞÇİ (Baretli, Deri Önlüklü, Mala Tutan)
             ================================================================ -->
        <g id="worker-left">
          <rect x="118" y="292" width="16" height="74" rx="5" fill="var(--tunic-slate)"/>
          <rect x="140" y="292" width="16" height="74" rx="5" fill="var(--tunic-slate)"/>
          <path d="M116 358 h20 a4 4 0 0 1 4 4 v4 h-24 z" fill="var(--stone-dark)"/>
          <path d="M138 358 h20 a4 4 0 0 1 4 4 v4 h-24 z" fill="var(--stone-dark)"/>

          <!-- Gövde & Deri Önlük -->
          <rect x="112" y="222" width="50" height="76" rx="12" fill="var(--tunic-canvas)"/>
          <rect x="120" y="246" width="34" height="52" rx="4" fill="var(--leather)"/>
          <rect x="122" y="222" width="6" height="26" rx="2" fill="var(--leather)"/>
          <rect x="146" y="222" width="6" height="26" rx="2" fill="var(--leather)"/>

          <!-- Baş & Pirinç Baret -->
          <g id="worker-left-head">
            <circle cx="139" cy="198" r="17" fill="var(--skin)"/>
            <circle cx="146" cy="196" r="2" fill="var(--stone-dark)"/>
            <path d="M143 204 q4 3 8 0" fill="none" stroke="var(--stone-dark)" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M120 192 c0 -13 38 -13 38 0 z" fill="var(--amber)"/>

          </g>

          <!-- Mala Tutan Sağ Kol -->
          <g id="worker-left-arm">
            <path d="M152 234 L188 252 L206 242" fill="none" stroke="var(--tunic-canvas)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="208" cy="241" r="6.5" fill="var(--skin)"/>
            <path d="M212 240 L232 232 L228 246 Z" fill="#A1A6AB" stroke="#5E6266" stroke-width="1"/>

        <!-- ================================================================
             MERKEZ: ÖRÜLEN TUĞLA DUVAR (JS İle Kat Kat İnşa Edilir)
             ================================================================ -->
        <g id="brick-wall-layer"></g>

        <!-- Harç & Tuğla Tozu Partikülleri -->
        <g id="dust-group" aria-hidden="true">

          <rect x="402" y="222" width="50" height="76" rx="12" fill="var(--accent)"/>
          <rect x="402" y="255" width="50" height="7" fill="var(--surface)" opacity="0.85"/>
          <rect x="402" y="273" width="50" height="7" fill="var(--surface)" opacity="0.85"/>

          <!-- Baş & Baret -->
          <g id="worker-right-head">
            <circle cx="424" cy="198" r="17" fill="var(--skin)"/>
            <circle cx="416" cy="196" r="2" fill="var(--stone-dark)"/>
            <path d="M412 204 q4 2 8 0" fill="none" stroke="var(--stone-dark)" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M405 192 c0 -13 38 -13 38 0 z" fill="#FAF8F3" stroke="var(--ink-secondary)" stroke-width="1"/>
            <rect x="400" y="190" width="46" height="5" rx="2.5" fill="#FAF8F3" stroke="var(--ink-secondary)" stroke-width="1"/>
          </g>

          <!-- Şakül Tutan Sol Kol -->

            <path d="M410 234 L380 224 L362 224" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="360" cy="224" r="6.5" fill="var(--skin)"/>
            <g id="plumb-bob">
              <line x1="360" y1="224" x2="360" y2="286" stroke="var(--ink-secondary)" stroke-width="1.2" stroke-dasharray="2 2"/>
              <path d="M355 286 L365 286 L360 300 Z" fill="var(--amber)"/>
            </g>
          </g>
        </g>
      </svg>
    </figure>

    <!-- 2. Öğe: 'Yakında...' Başlık Yazısı -->
    <h1 class="coming-soon-title">Yakında...</h1>
  </main>

  <script>
    (function () {
      'use strict';

      const wallLayer = document.getElementById('brick-wall-layer');
      const craneCarriage = document.getElementById('crane-carriage');
      const buildersSvg = document.getElementById('builders-svg');
      const sceneFrame = document.getElementById('scene-frame');
      const dustParticles = document.querySelectorAll('.dust-particle');

      const ROWS = 7;
      const COLS = 4;
      const BRICK_W = 42;
      const BRICK_H = 18;
      const GAP_X = 4;
      const GAP_Y = 4;
      const START_X = 192;
      const BASE_Y = 366 - BRICK_H;

      const brickColors = ['var(--brick-a)', 'var(--brick-b)', 'var(--brick-c)'];
      const bricks = [];
      const mortarLines = [];

      // Tuğla ve harç katmanlarını SVG sahnesine yerleştir
      function initWall() {
        const svgNS = 'http://www.w3.org/2000/svg';

        for (let r = 0; r < ROWS; r++) {
          const y = BASE_Y - r * (BRICK_H + GAP_Y);
          const staggerX = (r % 2 === 1) ? 10 : 0;

          const mortar = document.createElementNS(svgNS, 'rect');
          mortar.setAttribute('x', START_X + staggerX);
          mortar.setAttribute('y', y + BRICK_H);
          mortar.setAttribute('width', COLS * (BRICK_W + GAP_X) - GAP_X);
          mortar.setAttribute('height', GAP_Y);
          mortar.setAttribute('rx', '1');
          mortar.setAttribute('fill', 'var(--mortar)');
          mortar.classList.add('mortar-line');
          wallLayer.appendChild(mortar);
          mortarLines.push(mortar);

          for (let c = 0; c < COLS; c++) {
            const x = START_X + staggerX + c * (BRICK_W + GAP_X);
            const isKeystone = (r === 3 && (c === 1 || c === 2));
            const brick = document.createElementNS(svgNS, 'rect');

            brick.setAttribute('x', x);
            brick.setAttribute('y', y);
            brick.setAttribute('width', BRICK_W);
            brick.setAttribute('height', BRICK_H);
            brick.setAttribute('rx', '2.5');
            brick.setAttribute('fill', isKeystone ? 'var(--brick-crest)' : brickColors[(r + c) % brickColors.length]);
            brick.setAttribute('stroke', 'rgba(30, 28, 25, 0.16)');
            brick.setAttribute('stroke-width', '1');
            brick.classList.add('wall-brick');

            wallLayer.appendChild(brick);
            bricks.push({ el: brick, x, y });
          }
        }
      }

      function spawnMortarDust(x, y) {
        dustParticles.forEach((p, idx) => {
          p.setAttribute('cx', x + 14 + idx * 6);
          p.setAttribute('cy', y + BRICK_H);
          p.classList.remove('is-burst');
          void p.offsetWidth;
          p.classList.add('is-burst');
        });
      }

      const TOTAL_BRICKS = ROWS * COLS;
      const INITIAL_LAID = 10;
      let laidCount = INITIAL_LAID;
      let speedTimer = null;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function renderWall(withDust) {
        bricks.forEach((item, index) => {
          if (index < laidCount) {
            item.el.classList.add('is-placed');
          } else {
            item.el.classList.remove('is-placed');
          }
        });

        mortarLines.forEach((line, rowIdx) => {
          if (laidCount > rowIdx * COLS) {
            line.classList.add('is-visible');
          } else {
            line.classList.remove('is-visible');
          }
        });

        // Vinç arabasını sıradaki tuğlanın üzerine hizala
        const target = bricks[Math.min(laidCount, TOTAL_BRICKS - 1)];
        if (target) {
          const craneX = Math.max(210, Math.min(350, target.x + BRICK_W / 2));
          craneCarriage.setAttribute('transform', `translate(${craneX}, 0)`);
        }

        if (withDust && laidCount > 0 && laidCount <= TOTAL_BRICKS) {
          const last = bricks[laidCount - 1];
          spawnMortarDust(last.x, last.y);
        }
      }

      function stepConstruction() {
        if (laidCount < TOTAL_BRICKS) {
          laidCount += 1;
        } else {
          laidCount = INITIAL_LAID;
        }
        renderWall(!reducedMotion);
      }

      // Gizli dokunuş: Sahneye tıklandığında işçiler kısa süreliğine hızlanır
      function boostBuilders() {
        stepConstruction();
        if (!reducedMotion) {
          buildersSvg.classList.add('is-fast');
          clearTimeout(speedTimer);
          speedTimer = setTimeout(() => {
            buildersSvg.classList.remove('is-fast');
          }, 950);
        }
      }

      initWall();

      if (reducedMotion) {
        laidCount = TOTAL_BRICKS;
        renderWall(false);
      } else {
        renderWall(false);
        setInterval(() => {
          if (laidCount < TOTAL_BRICKS) {
            laidCount += 1;
            renderWall(true);
          } else {
            laidCount = INITIAL_LAID;
            renderWall(false);
          }
        }, 2100);
      }

      sceneFrame.addEventListener('click', boostBuilders);
      sceneFrame.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          boostBuilders();
        }
      });
    })();
  </script>
</body>
</html>
