<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blok Dünya Oyna</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    color: #fff;
    padding: 40px 20px;
  }

  header {
    text-align: center;
    margin-bottom: 50px;
  }

  header h1 {
    font-size: 3rem;
    background: linear-gradient(90deg, #00d4ff, #ff00ea);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  header p {
    color: #a0a0c0;
    font-size: 1.1rem;
  }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 30px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .game-card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 18px;
    overflow: hidden;
    text-decoration: none;
    color: #fff;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
  }

  .game-card:hover {
    transform: translateY(-8px);
    border-color: #00d4ff;
    box-shadow: 0 15px 40px rgba(0, 212, 255, 0.3);
  }

  .game-card .thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    position: relative;
    background: #0a0a1a;
  }

  .game-card .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }

  .game-card:hover .thumb img {
    transform: scale(1.08);
  }

  .game-card .info {
    padding: 20px 22px 24px;
  }

  .game-card .info h2 {
    font-size: 1.4rem;
    margin-bottom: 8px;
    color: #fff;
  }

  .game-card .info p {
    color: #9aa0b5;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .game-card .play-btn {
    display: inline-block;
    margin-top: 16px;
    padding: 10px 22px;
    background: linear-gradient(90deg, #00d4ff, #6a5cff);
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.5px;
    transition: filter 0.3s ease;
  }

  .game-card:hover .play-btn {
    filter: brightness(1.2);
  }

  footer {
    text-align: center;
    margin-top: 60px;
    color: #5a5f7a;
    font-size: 0.85rem;
  }

  @media (max-width: 600px) {
    header h1 { font-size: 2rem; }
  }
</style>
</head>
<body>

<header>
  <h1>🎮 Blok Dünya Oyna</h1>
  <p>Oynamak istediğin oyunu seç</p>
</header>

<main class="games-grid">

  <a class="game-card" href="blokdunya.html">
    <div class="thumb">
      <img src="blokdunya.jpg" alt="Blok Dünya Önizleme">
    </div>
    <div class="info">
      <h2>Blok Dünya</h2>
      <p>Bloklar dünyasında keşfe çık ve kendi dünyanı inşa et.</p>
      <span class="play-btn">▶ Oyna</span>
    </div>
  </a>

  <a class="game-card" href="blokdunya_ayi_haritasi.html">
    <div class="thumb">
      <img src="blokdunyamodayıharitası.jpg" alt="Blok Dünya Ayı Haritası Önizleme">
    </div>
    <div class="info">
      <h2>Blok Dünya: Ayı Haritası</h2>
      <p>Ayı haritasında yeni bir maceraya atıl!</p>
      <span class="play-btn">▶ Oyna</span>
    </div>
  </a>

</main>

<footer>
  © 2026 Blok Dünya Oyna — GitHub Pages
</footer>

</body>
</html>
